[project]
name = "sentinel-g"
version = "0.1.0"
description = "Sentinel-G — SME Financial Fraud Detection (HackHazards '26)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "MelvinDenish" }]

dependencies = [
    # --- Backend / API ---
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.36",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4,<5",  # passlib 1.7.4 (2020) incompatible with bcrypt 5.x
    "httpx>=0.27,<0.29",
    "python-multipart>=0.0.9",

    # --- Graph store ---
    "neo4j>=5.20",
    "networkx>=3.3,<4",

    # --- ML core ---
    "lightgbm>=4.3,<5",
    "catboost>=1.2,<2",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "mapie>=0.9,<1",

    # --- Deep learning (PyG, TGN). Install CUDA wheels via uv after install. ---
    # torch installed separately to pick the right CUDA wheel — see README.
    "torch>=2.3,<2.6",
    "torch-geometric>=2.5,<3",

    # mamba-ssm is Linux+CUDA-only — left commented; train in Colab/WSL.
    # "mamba-ssm>=2.2",

    # --- Document parsing / OCR ---
    "pdfplumber>=0.11,<1",
    "camelot-py>=0.11,<1",
    "pytesseract>=0.3.10,<1",
    "Pillow>=10,<12",

    # --- NLP ---
    "spacy>=3.7,<4",

    # --- LLM (narrative only — PRD §5.5) ---
    "google-generativeai>=0.7,<1",

    # --- Scraping ---
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    "playwright>=1.45,<2",

    # --- Reports ---
    "reportlab>=4,<5",

    # --- Misc ---
    "orjson>=3.10,<4",
    "tenacity>=8.3,<10",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "black>=24.4,<26",
    "pre-commit>=3.7,<5",
    "ipython>=8.25,<9",
    "rich>=13.7,<14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "ml/artifacts", ".docx_extract"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "ASYNC", "S", "RUF"]
ignore = ["E501", "S101"]  # line length handled by formatter; allow assert in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "ml/tests", "tests"]
# Tests import `from backend.app...` and `from ml...` directly. Without
# pythonpath = ["."], `[tool.uv].package = false` means the repo root is
# never installed onto sys.path and CI fails with ModuleNotFoundError.
# Locally pytest finds it via rootdir inference but CI's stricter cwd
# resolution needs this explicit pin.
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["data", "ml/artifacts", "node_modules", ".venv", ".docx_extract"]

[tool.uv]
package = false
